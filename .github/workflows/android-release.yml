name: Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify release version matches library version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          LIB_VERSION=$(./gradlew -q :shared:properties | awk '/^version:/{print $2}' | head -n 1)

          echo "Tag version: $TAG_VERSION"
          echo "Library version: $LIB_VERSION"

          if [ "$TAG_VERSION" != "$LIB_VERSION" ]; then
            echo "Version mismatch: tag $TAG_VERSION does not match library version $LIB_VERSION"
            exit 1
          fi

      - name: Publish Android library to GitHub Packages
        run: ./gradlew :shared:publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          gpr.user: ${{ github.actor }}
          gpr.key: ${{ secrets.GITHUB_TOKEN }}
