name: Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify release version matches library version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          LIB_VERSION=$(./gradlew -q :shared:properties | awk '/^version:/{print $2}' | head -n 1)

          echo "Tag version: $TAG_VERSION"
          echo "Library version: $LIB_VERSION"

          if [ "$TAG_VERSION" != "$LIB_VERSION" ]; then
            echo "Version mismatch: tag $TAG_VERSION does not match library version $LIB_VERSION"
            exit 1
          fi

      - name: Publish Android library to Maven Central
        run: ./gradlew :shared:publish :shared:closeAndReleaseSonatypeStagingRepository
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
